name: Sign catalog

# When recipes (or the signing scripts) change on main, rebuild index.json, sign it with the catalog key and commit
# index.json + index.json.sig back. The private key lives only in the CATALOG_SIGNING_KEY secret.
on:
  push:
    branches: [main]
    paths: ['recipes/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-catalog
  cancel-in-progress: false

jobs:
  sign:
    # Never react to our own signing commit (pushes made with GITHUB_TOKEN don't start workflows
    # anyway; this is a second guard).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and sign index.json
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: node scripts/sign.mjs

      - name: Check it the way the app does
        run: node scripts/verify.mjs

      - name: Commit the signed index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json index.json.sig
          if git diff --cached --quiet; then
            echo "Index already up to date."
            exit 0
          fi
          git commit -m "Sign catalog index [skip ci]"
          git push
